crons:
  - name: invoice-reminders
    description: "Daily 10am IST: CRM + email reminder for shared invoices past due, every 3 days until paid"
    cron: "0 10 * * *"
    timezone: "Asia/Kolkata"
    endpoint: "{{BASE_URL}}/api/cron/invoice-reminders"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: admin-morning-digest
    description: "Daily 8am IST: AI summary of yesterday's busiest Patient and Provider app activity for master admins"
    cron: "0 8 * * *"
    timezone: "Asia/Kolkata"
    endpoint: "{{BASE_URL}}/api/cron/admin-digest"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: monthly-draft-invoices
    description: "1st of each month 6am IST: raise draft invoices for last month for every provider"
    cron: "30 0 1 * *"
    endpoint: "{{BASE_URL}}/api/cron/monthly-invoices"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: abdm-care-context-sync
    description: "Every 15 min: find new discharge summaries, lab reports, OPD notes, prescriptions and bills for ABHA-linked patients and link them on ABDM"
    cron: "*/15 * * * *"
    endpoint: "{{BASE_URL}}/api/abdm/cron/sync"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: erase-archived-users
    description: "Daily 3am IST: permanently erase users deleted from Trata Users more than 30 days ago"
    cron: "30 21 * * *"
    endpoint: "{{BASE_URL}}/api/admin/cron/erase-archived"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
